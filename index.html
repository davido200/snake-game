<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0f111a;
    --panel: #1a1d2e;
    --border: #2a2d3e;
    --fg: #e1e4ed;
    --muted: #7a7f96;
    --accent: #5eead4;
    --snake: #5eead4;
    --snake-head: #a7f3d0;
    --food: #fbbf24;
    --danger: #f87171;
    --grid: rgba(94, 234, 212, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px;
    width: min(480px, 100vw);
  }

  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
  }

  .scores {
    display: flex;
    gap: 20px;
    font-size: 13px;
  }

  .score-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .score-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .score-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }

  .score-value.high {
    color: var(--food);
  }

  .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
    text-align: center;
    text-transform: uppercase;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.08), 0 8px 32px rgba(0,0,0,0.4);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(15, 17, 26, 0.88);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .overlay-title.paused  { color: var(--accent); }
  .overlay-title.gameover { color: var(--danger); }

  .overlay-sub {
    color: var(--muted);
    font-size: 14px;
  }

  .overlay-score {
    font-size: 18px;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    min-width: 80px;
    touch-action: manipulation;
  }

  button:hover { background: #23263a; }
  button:active { transform: scale(0.97); }

  button.primary {
    background: var(--accent);
    color: #0f111a;
    border-color: var(--accent);
  }
  button.primary:hover { background: #7ff0e0; }

  .controls-row {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .difficulty-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .diff-btn {
    padding: 7px 14px;
    font-size: 12px;
    min-width: 60px;
  }

  .diff-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(94, 234, 212, 0.08);
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    margin-top: 4px;
    line-height: 1.4;
  }

  @media (max-width: 420px) {
    .game-container { padding: 12px; gap: 12px; }
    .score-value { font-size: 22px; }
    .title { font-size: 18px; }
    .overlay-title { font-size: 22px; }
    button { font-size: 13px; padding: 9px 16px; min-width: 70px; }
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="scores">
      <div class="score-block">
        <span class="score-label">Score</span>
        <span class="score-value" id="currentScore">0</span>
      </div>
      <div class="score-block">
        <span class="score-label">Best</span>
        <span class="score-value high" id="highScore">0</span>
      </div>
    </div>
    <div class="title">Snake</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title paused" id="overlayTitle">Paused</div>
      <div class="overlay-sub" id="overlaySub">Press P or tap to resume</div>
      <div class="overlay-score" id="overlayScore" style="display:none"></div>
      <div class="btn-row" id="overlayButtons">
        <button class="primary" id="resumeBtn">Resume</button>
        <button id="restartBtn">Restart</button>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="difficulty-row" id="diffRow">
      <button class="diff-btn" data-diff="easy">Easy</button>
      <button class="diff-btn active" data-diff="normal">Normal</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>
    <div class="hint">Arrow keys / WASD to move · P to pause · Swipe on mobile</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────
  const COLS = 20;
  const ROWS = 20;
  const DIFFICULTY = {
    easy:   { speed: 160, label: 'Easy'   },
    normal: { speed: 110, label: 'Normal' },
    hard:   { speed:  65, label: 'Hard'   }
  };

  // ── DOM ──────────────────────────────────────────────────────────────────
  const canvas   = document.getElementById('game');
  const ctx      = canvas.getContext('2d');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('overlayTitle');
  const ovSub    = document.getElementById('overlaySub');
  const ovScore  = document.getElementById('overlayScore');
  const ovBtns   = document.getElementById('overlayButtons');
  const resumeBtn= document.getElementById('resumeBtn');
  const restartBtn= document.getElementById('restartBtn');
  const curScoreEl = document.getElementById('currentScore');
  const highScoreEl= document.getElementById('highScore');
  const diffRow   = document.getElementById('diffRow');

  // ── Canvas sizing ───────────────────────────────────────────────────────
  let CELL; // computed on resize
  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    CELL = rect.width / COLS;
    canvas.width  = COLS * CELL * dpr;
    canvas.height = ROWS * CELL * dpr;
    canvas.style.width  = rect.width + 'px';
    canvas.style.height = rect.width + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  // ── State ───────────────────────────────────────────────────────────────
  let snake, direction, nextDirection, food, score, highScore, gameOver, paused;
  let lastTime, tickTimer, pendingMove;
  let difficulty = 'normal';

  // ── High score ──────────────────────────────────────────────────────────
  function loadHighScore() {
    try {
      const v = parseInt(localStorage.getItem('snake_high') || '0', 10);
      highScore = isNaN(v) ? 0 : Math.max(0, v);
    } catch { highScore = 0; }
    highScoreEl.textContent = highScore;
  }
  function saveHighScore() {
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      try { localStorage.setItem('snake_high', String(highScore)); } catch {}
    }
  }
  loadHighScore();

  // ── Game init ───────────────────────────────────────────────────────────
  function initGame() {
    const mid = Math.floor(COLS / 2);
    snake = [
      { x: mid, y: Math.floor(ROWS / 2) },
      { x: mid - 1, y: Math.floor(ROWS / 2) },
      { x: mid - 2, y: Math.floor(ROWS / 2) }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    spawnFood();
    score = 0;
    gameOver = false;
    paused = false;
    curScoreEl.textContent = '0';
    overlay.classList.remove('active');
    lastTime = performance.now();
    tickTimer = 0;
    pendingMove = null;
    requestAnimationFrame(loop);
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (occupied.has(`${pos.x},${pos.y}`));
    food = pos;
  }

  // ── Game loop ───────────────────────────────────────────────────────────
  function loop(now) {
    if (gameOver || paused) return;
    const dt = now - lastTime;
    lastTime = now;
    const cfg = DIFFICULTY[difficulty];
    tickTimer += dt;
    if (tickTimer >= cfg.speed) {
      tickTimer -= cfg.speed;
      executeMove();
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ── Movement ────────────────────────────────────────────────────────────
  function executeMove() {
    if (pendingMove) {
      direction = pendingMove;
      pendingMove = null;
    }

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame();
      return;
    }
    // self collision
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        endGame();
        return;
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      curScoreEl.textContent = score;
      spawnFood();
      // don't pop — snake grows
    } else {
      snake.pop();
    }
  }

  // ── Input ───────────────────────────────────────────────────────────────
  function setDirection(dir) {
    if (gameOver || paused) return;
    // prevent 180° reversal
    if (dir.x + direction.x === 0 && dir.y + direction.y === 0) return;
    if (pendingMove) return; // one move per tick
    pendingMove = dir;
  }

  // Keyboard
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key === 'p' || key === 'escape') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (key === 'r' && gameOver) {
      e.preventDefault();
      initGame();
      return;
    }
    if (gameOver || paused) return;
    switch (key) {
      case 'arrowup':    case 'w': setDirection({ x: 0, y: -1 }); e.preventDefault(); break;
      case 'arrowdown':  case 's': setDirection({ x: 0, y: 1 });  e.preventDefault(); break;
      case 'arrowleft':  case 'a': setDirection({ x: -1, y: 0 }); e.preventDefault(); break;
      case 'arrowright': case 'd': setDirection({ x: 1, y: 0 });  e.preventDefault(); break;
    }
  });

  // Touch / swipe
  let touchStartX, touchStartY, touchStartTime;
  canvas.addEventListener('touchstart', (e) => {
    if (gameOver) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
    handleOverlayTap(e);
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (gameOver) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const elapsed = Date.now() - touchStartTime;
    if (elapsed > 400) return; // too slow, treat as tap
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < 12) return; // too short
    if (absDx > absDy) {
      setDirection({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      setDirection({ x: 0, y: dy > 0 ? 1 : -1 });
    }
  }, { passive: true });

  // Click/tap on canvas to toggle pause
  canvas.addEventListener('click', handleOverlayTap);
  function handleOverlayTap(e) {
    if (!overlay.classList.contains('active')) {
      if (!gameOver && !paused) {
        togglePause();
      }
    }
  }

  // ── Overlay / pause ─────────────────────────────────────────────────────
  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    if (paused) {
      showOverlay('paused', 'Press P or tap to resume', 'Resume', restartBtn);
    } else {
      overlay.classList.remove('active');
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function showOverlay(titleCls, sub, firstLabel, secondBtn) {
    ovTitle.textContent = titleCls === 'gameover' ? 'Game Over' : 'Paused';
    ovTitle.className = 'overlay-title ' + titleCls;
    ovSub.textContent = sub;
    if (titleCls === 'gameover') {
      ovScore.style.display = '';
      ovScore.textContent = `Score: ${score}`;
      resumeBtn.style.display = 'none';
      // second button is restart
      secondBtn.textContent = 'Play Again';
      secondBtn.onclick = () => initGame();
      secondBtn.style.display = '';
    } else {
      ovScore.style.display = 'none';
      resumeBtn.style.display = '';
      resumeBtn.textContent = firstLabel;
      resumeBtn.onclick = () => togglePause();
      secondBtn.textContent = 'Restart';
      secondBtn.onclick = () => initGame();
      secondBtn.style.display = '';
    }
    overlay.classList.add('active');
  }

  function endGame() {
    gameOver = true;
    saveHighScore();
    showOverlay('gameover', 'Press R or tap to play again', null, restartBtn);
  }

  resumeBtn.addEventListener('click', () => togglePause());
  restartBtn.addEventListener('click', () => initGame());

  // ── Difficulty ──────────────────────────────────────────────────────────
  diffRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.diff-btn');
    if (!btn) return;
    if (btn.classList.contains('active')) return;
    diffRow.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    // Reset tick timer so the new speed takes effect immediately
    tickTimer = 0;
  });

  // ── Drawing ─────────────────────────────────────────────────────────────
  function draw() {
    const w = CELL * COLS, h = CELL * ROWS;
    ctx.clearRect(0, 0, w, h);

    // grid (subtle)
    ctx.strokeStyle = 'rgba(94, 234, 212, 0.045)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, h);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL + 0.5);
      ctx.lineTo(w, i * CELL + 0.5);
      ctx.stroke();
    }

    // food — pulsing glow circle
    if (!gameOver) {
      const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 200);
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const r = CELL * 0.38 * pulse;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
      grad.addColorStop(0, '#fcd34d');
      grad.addColorStop(0.6, '#fbbf24');
      grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(r, 3), 0, Math.PI * 2);
      ctx.fill();
    }

    // snake — rounded segments
    if (snake.length > 0) {
      for (let i = 0; i < snake.length; i++) {
        const s = snake[i];
        const isHead = i === 0;
        const pad = CELL * 0.08;
        const radius = CELL * 0.22;
        const x = s.x * CELL + pad;
        const y = s.y * CELL + pad;
        const size = CELL - pad * 2;

        // glow for head
        if (isHead) {
          ctx.shadowColor = 'rgba(94, 234, 212, 0.5)';
          ctx.shadowBlur = CELL * 0.8;
        } else {
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
        }

        ctx.fillStyle = isHead ? '#a7f3d0' : '#5eead4';
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, radius);
        ctx.fill();

        // subtle direction eyes on head
        if (isHead) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#0f111a';
          const eyeR = CELL * 0.07;
          let ex1, ey1, ex2, ey2;
          if (direction.x === 1)       { ex1 = x + size*0.7;  ey1 = y + size*0.25; ex2 = x + size*0.7;  ey2 = y + size*0.75; }
          else if (direction.x === -1) { ex1 = x + size*0.3;  ey1 = y + size*0.25; ex2 = x + size*0.3;  ey2 = y + size*0.75; }
          else if (direction.y === -1) { ex1 = x + size*0.25; ey1 = y + size*0.3;  ex2 = x + size*0.75; ey2 = y + size*0.3;  }
          else                          { ex1 = x + size*0.25; ey1 = y + size*0.7;  ex2 = x + size*0.75; ey2 = y + size*0.7;  }
          ctx.beginPath(); ctx.arc(ex1, ey1, eyeR, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, eyeR, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  // polyfill roundRect if needed
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = roundRect;
  }

  // ── Start ───────────────────────────────────────────────────────────────
  resizeCanvas();
  initGame();
})();
</script>
</body>
</html>
